[versions]
agp = "9.3.1"
kotlin = "2.2.10"
coroutines = "1.11.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
activity = "1.13.0"
lifecycle = "2.11.0"
exifinterface = "1.4.2"
camerax = "1.6.2"
webkit = "1.14.0"
jsoup = "1.23.2"
gson = "2.11.0"
junit = "4.13.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# WebViewAssetLoader：用 https://appassets.androidplatform.net/ 提供本地资源，
# 比开 allowFileAccess 安全，也让页面有稳定的 origin 可以写进 CSP。
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# 用 Gson 而不是 org.json：:protocol 是纯 JVM 模块，拿不到 Android 的 org.json；
# 若打包 org.json:json 又会与 Android 平台的同名类冲突。
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 不要添加 org.jetbrains.kotlin.android：AGP 9.3.1 内置 Kotlin 支持，重复 apply 会冲突。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
