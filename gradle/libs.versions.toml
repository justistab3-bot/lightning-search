[versions]
agp = "9.3.1"
kotlin = "2.2.10"
coroutines = "1.11.0"
# 为了支持 Android 5.0（minSdk 21），整套 AndroidX 退回 2024 年版本 ——
# 2025 年的版本集体把最低要求提到了 23。升级任何一个都要连带升一整片。
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
viewpager2 = "1.1.0"
activity = "1.9.3"
lifecycle = "2.8.7"
exifinterface = "1.3.7"
camerax = "1.4.1"
webkit = "1.12.1"
jsoup = "1.23.2"
gson = "2.11.0"
junit = "4.13.2"
json = "20250517"
desugar = "2.1.5"
# 友盟+ 统计与崩溃分析。三个都要：common + asms 是统计底座（官方标「必选」），
# apm 才是崩溃/ANR 采集。AAR 里没声明 minSdk，跟随主工程，所以不挡 Android 5.0；
# 原生库带 armeabi-v7a，32 位老设备能跑。
umengCommon = "9.9.10"
umengAsms = "1.8.7.2"
umengApm = "2.1.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# WebViewAssetLoader：用 https://appassets.androidplatform.net/ 提供本地资源，
# 比开 allowFileAccess 安全，也让页面有稳定的 origin 可以写进 CSP。
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# 用 Gson 而不是 org.json：:protocol 是纯 JVM 模块，拿不到 Android 的 org.json；
# 若打包 org.json:json 又会与 Android 平台的同名类冲突。
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
# 只给单元测试用（testImplementation），不会打进 APK，所以不会和 Android 平台的
# 同名类冲突。作用是让跑在 JVM 上的测试拿到真实的 org.json，而不是 android.jar 的桩。
json = { module = "org.json:json", version.ref = "json" }
# 核心库脱糖：把 Java 8+ 的 API 改写成 Android 5.0 上能跑的等价实现。
# 只影响编译产物，不打进 APK 的类（生成的合成类除外）。
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
# 友盟在阿里云 public 镜像上（官方文档写 repo1.maven.org，本机直连 403，镜像是它的代理）
umeng-common = { module = "com.umeng.umsdk:common", version.ref = "umengCommon" }
umeng-asms = { module = "com.umeng.umsdk:asms", version.ref = "umengAsms" }
umeng-apm = { module = "com.umeng.umsdk:apm", version.ref = "umengApm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 不要添加 org.jetbrains.kotlin.android：AGP 9.3.1 内置 Kotlin 支持，重复 apply 会冲突。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
